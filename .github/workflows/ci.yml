name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same branch makes the running job pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # No secrets are needed here: the database handle is created lazily in
      # src/lib/db/index.ts, so nothing touches DATABASE_URL at build time.
      - name: Build
        run: npm run build
